name: Reportar un error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. **Si es una vulnerabilidad de seguridad, no uses este formulario**: sigue la [política de seguridad](https://github.com/sebastianvelezg/OBLIVION/security/policy).
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
      description: Describe el error y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Voy a…
        2. Pulso…
        3. Veo…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Oblivion
      description: La etiqueta de la imagen (p. ej. 0.1.0) o el commit.
    validations:
      required: true
  - type: dropdown
    id: instalacion
    attributes:
      label: Cómo lo instalaste
      options:
        - Docker Compose (imagen publicada)
        - Docker (construida desde el código)
        - Sin Docker
    validations:
      required: true
  - type: input
    id: servicio
    attributes:
      label: Servicio y versión (si es un problema de un plugin)
      placeholder: Jellyfin 10.10.3, Speedtest Tracker 1.2.4…
  - type: textarea
    id: registros
    attributes:
      label: Registros
      description: "Salida de `docker compose logs --tail 100`. **Revisa que no incluya claves ni contraseñas.**"
      render: shell
