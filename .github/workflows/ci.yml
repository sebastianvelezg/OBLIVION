name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Informativo: Dependabot se encarga de las actualizaciones.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Imagen de Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: oblivion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prueba de humo (con el mismo endurecimiento que el compose)
        run: |
          docker run -d --name oblivion \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -p 3000:3000 -v oblivion-ci-data:/data oblivion:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs oblivion
          exit 1
